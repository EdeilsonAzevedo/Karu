repos:
  #checagem de tipos
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2   # usa a versão estável mais recente
    hooks:
      - id: mypy
  
  # formatação
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # tipo de commit
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.28.0
    hooks:
      - id: commitizen
        stages: [commit-msg]