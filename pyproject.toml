[project]
name = "karu"
version = "0.1.0"
description = ""
authors = [
    {name = "edeilsonazevedo",email = "edeilsonazavedo22@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.6,<6.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "ruff (>=0.13.0,<0.14.0)",
    "psycopg2-binary (>=2.9.9)",
    "psycopg (>=3.2.10,<4.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=37.8.0,<38.0.0)",
    "pytest-factoryboy (>=2.8.1,<3.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "django-auditlog (>=3.3.0,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "dj-database-url (>=3.0.1,<4.0.0)",
    "whitenoise (>=6.11.0,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xhtml2pdf (>=0.2.17,<0.3.0)",

]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100
target-version = "py312"
fix = true                  # corrigi de forma automática

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"  
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Configurações para acelerar testes
addopts = [
    "--reuse-db",
    "--nomigrations", 
    "--cov=apps",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-branch",
    "--verbose",
    "--tb=short",
    "--strict-markers",
]

# Diretórios a serem testados
testpaths = ["apps", "tests"]

# Markers customizados
markers = [
    "django_db: marks tests as needing database access",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Filtros de warnings
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Configuração de cobertura
[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*", 
    "*/venv/*",
    "manage.py",
    "*/settings/*",
    "*/conftest.py",
]

# ignora na cobertura as linhas que não precisam ser testadas
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
[dependency-groups]
dev = [
    "pre-commit (>=4.3.0,<5.0.0)",
    "ruff (>=0.13,<0.14)",
    "commitizen (>=4.9.1,<5.0.0)"
]
