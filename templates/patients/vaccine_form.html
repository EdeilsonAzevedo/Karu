<form id="ajax-vaccine-form" method="POST" action="{{ action_url }}">
    {% csrf_token %}
    <div class="space-y-4">
        {{ form.as_p }}
    </div>
    <div class="modal-action">
        <button type="button" class="btn btn-ghost" onclick="vaccine_modal.close()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitVaccineForm()">Salvar Vacina</button>
    </div>
</form>
